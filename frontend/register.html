<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Register</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrapper">
  
  <div class="auth-left">
    <div class="auth-brand">EstateElite</div>
    <div class="auth-left-content fade-up">
      <h1>Join<br><em>EstateElite</em></h1>
      <p>Create your account and start your real estate journey — whether you're listing or looking.</p>
      <div class="auth-stats">
        <div><div class="stat-val">Free</div><div class="stat-lbl">Registration</div></div>
        <div><div class="stat-val">2 min</div><div class="stat-lbl">Setup Time</div></div>
        <div><div class="stat-val">∞</div><div class="stat-lbl">Listings Access</div></div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2>Create account</h2>
      <p class="auth-sub">Join thousands of owners and buyers</p>

      <div id="errMsg" class="alert-soft mb-3 d-none"></div>

      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Full name</label>
          <input type="text" id="name" class="form-control" placeholder="Ravi Kumar" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6"/>
        </div>

        <div class="mb-4">
          <label class="form-label">I am a</label>
          <div class="role-grid">
            <div class="role-card selected" id="roleOwner" onclick="selectRole('owner')">
              <span class="role-em">🏠</span>Owner / Seller
            </div>
            <div class="role-card" id="roleBuyer" onclick="selectRole('buyer')">
              <span class="role-em">🔑</span>Buyer
            </div>
          </div>
          <input type="hidden" id="role" value="owner"/>
        </div>

        <button type="submit" class="btn-gold" id="submitBtn">
          <span id="btnText">Create Owner Account</span>
          <span id="btnSpinner" class="spinner-gold d-none"></span>
        </button>
      </form>

      <div class="auth-switch mt-4">
        Already have an account? <a href="index.html">Sign in</a>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script>
  function selectRole(role) {
    document.getElementById('role').value = role;
    document.getElementById('roleOwner').classList.toggle('selected', role === 'owner');
    document.getElementById('roleBuyer').classList.toggle('selected', role === 'buyer');
    document.getElementById('btnText').textContent =
      role === 'owner' ? 'Create Owner Account' : 'Create Buyer Account';
  }

  document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('errMsg');
    errEl.classList.add('d-none');

    const name     = document.getElementById('name').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const role     = document.getElementById('role').value;

    if (password.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters.';
      errEl.classList.remove('d-none');
      return;
    }

    const btn   = document.getElementById('submitBtn');
    const txtEl = document.getElementById('btnText');
    const spin  = document.getElementById('btnSpinner');

    btn.disabled = true;
    txtEl.classList.add('d-none');
    spin.classList.remove('d-none');

    const { ok, data } = await apiFetch('/users/register', {
      method: 'POST',
      body: JSON.stringify({ name, email, password, role })
    });

    if (!ok) {
      errEl.textContent = data?.message || 'Registration failed. Try again.';
      errEl.classList.remove('d-none');
      btn.disabled = false;
      txtEl.classList.remove('d-none');
      spin.classList.add('d-none');
      return;
    }

    // Auto-login after register
    const { ok: ok2, data: d2 } = await apiFetch('/users/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });

    btn.disabled = false;
    txtEl.classList.remove('d-none');
    spin.classList.add('d-none');

    if (ok2) {
      Auth.save(d2);
      showToast('Account created! Welcome to EstateElite 🏡');
      setTimeout(() => {
        window.location.href = d2.role === 'owner'
          ? 'pages/owner-dashboard.html'
          : 'pages/buyer-dashboard.html';
      }, 700);
    } else {
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
