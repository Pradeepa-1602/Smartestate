<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Contacts</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-shell">
  <div id="sidebarWrap"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Contacts</h1>
        <p class="page-sub">Your property network and key contacts</p>
      </div>
      <button class="btn-gold" style="width:auto;padding:.7rem 1.3rem;" data-bs-toggle="modal" data-bs-target="#addContactModal">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Contact
      </button>
    </div>

    <div class="page-body">
      <div class="row g-3" id="contactsGrid">
        <!-- Populated by JS -->
      </div>
    </div>
  </main>
</div>

<!-- Add Contact Modal -->
<div class="modal fade" id="addContactModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Add Contact</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3"><label class="form-label">Full Name</label><input class="form-control" id="cName" placeholder="Ravi Kumar"/></div>
        <div class="mb-3"><label class="form-label">Role / Title</label><input class="form-control" id="cRole" placeholder="Property Agent"/></div>
        <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" id="cPhone" placeholder="+91 98400 12345"/></div>
        <div class="mb-3"><label class="form-label">Area</label><input class="form-control" id="cArea" placeholder="Chennai North"/></div>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select class="form-select" id="cTag">
            <option value="Agent">Agent</option>
            <option value="Legal">Legal</option>
            <option value="Finance">Finance</option>
            <option value="Design">Design</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn-gold" style="width:auto;padding:.7rem 1.5rem;" id="saveContactBtn">Save Contact</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script>
  const user = Auth.checkRole('owner');
  if (user) initSidebar(user, 'contacts');

  const tagColors = {
    Agent: 'tag-gold', Legal: 'tag-blue', Finance: 'tag-green', Design: 'tag-blue', Other: 'tag-gold'
  };

  // Load from localStorage
  function getContacts() {
    const defaults = [
      { name:'Varun Kumar',   role:'Property Agent',   phone:'+91 98400 12345', area:'Chennai North',   tag:'Agent' },
      { name:'Prakash Sharma', role:'Legal Advisor',    phone:'+91 98711 56789', area:'Thirunelveli',        tag:'Legal' },
      { name:'Kamal Kumar',    role:'Bank Loan Officer',phone:'+91 99940 23456', area:'Coimbatore',    tag:'Finance' },
      { name:'Abarnithi',   role:'Interior Designer',phone:'+91 97890 67890', area:'Thoothukudi',      tag:'Design' },
    ];
    try {
      const saved = JSON.parse(localStorage.getItem('ee_contacts'));
      return saved || defaults;
    } catch { return defaults; }
  }

  function saveContacts(list) { localStorage.setItem('ee_contacts', JSON.stringify(list)); }

  function renderContacts() {
    const contacts = getContacts();
    const grid = document.getElementById('contactsGrid');
    grid.innerHTML = contacts.map((c, i) => {
      const initials = c.name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
      return `
        <div class="col-md-4 col-sm-6 fade-up" style="animation-delay:${i*70}ms">
          <div class="contact-card">
            <div class="d-flex align-items-center gap-3 mb-3">
              <div class="avatar" style="width:46px;height:46px;font-size:1rem;">${initials}</div>
              <div>
                <div style="font-weight:500;font-size:.96rem;">${c.name}</div>
                <div style="color:var(--stone);font-size:.8rem;">${c.role}</div>
              </div>
            </div>
            <div class="d-flex align-items-center gap-2 mb-2" style="font-size:.84rem;color:var(--stone);">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
              ${c.phone}
            </div>
            <div class="d-flex align-items-center gap-2 mb-3" style="font-size:.84rem;color:var(--stone);">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>
              ${c.area}
            </div>
            <span class="tag ${tagColors[c.tag] || 'tag-gold'}">${c.tag}</span>
          </div>
        </div>`;
    }).join('');
  }

  renderContacts();

  document.getElementById('saveContactBtn').addEventListener('click', () => {
    const name  = document.getElementById('cName').value.trim();
    const role  = document.getElementById('cRole').value.trim();
    const phone = document.getElementById('cPhone').value.trim();
    const area  = document.getElementById('cArea').value.trim();
    const tag   = document.getElementById('cTag').value;
    if (!name || !phone) { showToast('Name and phone are required','error'); return; }
    const contacts = getContacts();
    contacts.push({ name, role, phone, area, tag });
    saveContacts(contacts);
    renderContacts();
    bootstrap.Modal.getInstance(document.getElementById('addContactModal')).hide();
    showToast('Contact saved!');
  });
</script>
</body>
</html>
