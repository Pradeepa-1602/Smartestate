<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Owner Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div class="app-shell">
  <div id="sidebarWrap"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="greeting">Dashboard</h1>
        <p class="page-sub">Your property portfolio at a glance</p>
      </div>
      <a href="add-property.html" class="btn-gold" style="width:auto;padding:.7rem 1.3rem;text-decoration:none;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Property
      </a>
    </div>

    <div class="page-body">
      <!-- Stats -->
      <div class="row g-3 mb-4" id="statsRow">
        <div class="col-md-3"><div class="stat-card fade-up"><div class="sc-label">Total Listings</div><div class="sc-val" id="statTotal">—</div></div></div>
        <div class="col-md-3"><div class="stat-card fade-up delay-1"><div class="sc-label">For Sale</div><div class="sc-val" id="statSale">—</div></div></div>
        <div class="col-md-3"><div class="stat-card fade-up delay-2"><div class="sc-label">For Rent</div><div class="sc-val" id="statRent">—</div></div></div>
        <div class="col-md-3"><div class="stat-card fade-up delay-3"><div class="sc-label">Portfolio Value</div><div class="sc-val" id="statVal">—</div></div></div>
      </div>

      <!-- Recent listings -->
      <div class="section-row mb-3">
        <h3 class="section-title">Recent Listings</h3>
        <a href="my-properties.html" class="btn-outline-gold btn btn-sm">View all →</a>
      </div>

      <div id="propsContainer">
        <div class="d-flex align-items-center gap-3 py-5 justify-content-center text-secondary">
          <div class="spinner-gold"></div> <span>Loading properties…</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script>
  const user = Auth.checkRole('owner');
  if (user) {
    initSidebar(user, 'owner-dashboard');
    document.getElementById('greeting').textContent =
      `Good day, ${user.name?.split(' ')[0] || 'Owner'} 👋`;

    apiFetch('/properties').then(({ data }) => {
      const all = Array.isArray(data) ? data : [];
      const mine = all.filter(p => p.owner_id === user.user_id);
      const saleN = mine.filter(p => p.property_type === 'SALE').length;
      const rentN = mine.filter(p => p.property_type === 'RENT').length;
      const total = mine.reduce((s, p) => s + Number(p.price), 0);

      document.getElementById('statTotal').textContent = mine.length;
      document.getElementById('statSale').textContent  = saleN;
      document.getElementById('statRent').textContent  = rentN;
      document.getElementById('statVal').textContent   = `₹${(total / 1e7).toFixed(1)}Cr`;

      const container = document.getElementById('propsContainer');
      if (mine.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>
            <h3>No properties yet</h3>
            <p>Start by listing your first property.</p>
            <a href="add-property.html" class="btn-gold mt-3" style="width:auto;padding:.7rem 1.3rem;text-decoration:none;display:inline-flex;">Add First Property</a>
          </div>`;
      } else {
        container.innerHTML = `<div class="row g-3">
          ${mine.slice(0, 3).map((p, i) => `<div class="col-md-4">${buildPropCard(p, { animDelay: i })}</div>`).join('')}
        </div>`;
      }
    });
  }
</script>
</body>
</html>
