<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Enquiries</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div class="app-shell">
  <div id="sidebarWrap"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Customer Enquiries</h1>
        <p class="page-sub" id="countSub">Loading…</p>
      </div>
    </div>

    <div class="page-body">
      <div class="row g-3" id="enqContainer">
        <!-- Data will load here -->
      </div>
    </div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script>
  const user = Auth.checkRole('owner');

  if (user) {
    initSidebar(user, 'enquiries'); // ✅ correct active tab
    loadEnquiries();
  }

  async function loadEnquiries() {
    const { ok, data } = await apiFetch('/enquiries/' + user.user_id);
    const container = document.getElementById('enqContainer');

    if (!ok || !Array.isArray(data)) {
      container.innerHTML = `<div class="empty-state">
        <h3>Error loading enquiries</h3>
        <p>Check backend connection</p>
      </div>`;
      return;
    }

    document.getElementById('countSub').textContent =
      `${data.length} enquir${data.length !== 1 ? 'ies' : 'y'} received`;
      // ✅ Save enquiry count for badge
localStorage.setItem('ee_owner_enquiries', data.length);
initSidebar(user, 'enquiries');

    if (data.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
        <h3>No enquiries yet</h3>
        <p>When buyers contact you, they will appear here.</p>
      </div>`;
      return;
    }

    container.innerHTML = data.map((e, i) => `
      <div class="col-md-4 fade-up" style="animation-delay:${i*80}ms">
        <div class="contact-card">
          
          <!-- Property Info -->
          <div style="margin-bottom:10px;">
            <div style="font-weight:500;font-size:.95rem;">${e.title}</div>
            <div style="color:var(--stone);font-size:.8rem;">${e.location}</div>
            <div style="font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--gold-dark);">
              ₹${Number(e.price).toLocaleString('en-IN')}
            </div>
          </div>

          <hr/>

          <!-- Buyer Info -->
          <div style="font-weight:500;">${e.buyer_name}</div>
          <div style="color:var(--stone);font-size:.85rem;margin-bottom:6px;">
            📞 ${e.buyer_phone}
          </div>

          <!-- Message -->
          <div style="font-size:.85rem;color:var(--stone);margin-bottom:8px;">
            ${e.message || 'No message'}
          </div>

          <!-- Date -->
          <div style="font-size:.75rem;color:var(--stone);">
            ${new Date(e.created_at).toLocaleDateString('en-IN')}
          </div>

        </div>
      </div>
    `).join('');
    //setInterval(loadEnquiries, 5000); // refresh every 5 sec
  }
</script>

</body>
</html>
