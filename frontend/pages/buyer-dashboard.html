<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Buyer Dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>

<div class="app-shell">
  <div id="sidebarWrap"></div>

  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title" id="greeting">Dashboard</h1>
        <p class="page-sub">Find your dream property today</p>
      </div>
      <div class="d-flex gap-2">
        <a href="wishlist.html" class="btn btn-outline-secondary" style="border-radius:8px;font-size:.88rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
          Wishlist (<span id="wishCount">0</span>)
        </a>
        <a href="browse.html" class="btn-gold" style="width:auto;padding:.65rem 1.2rem;text-decoration:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          Browse All
        </a>
      </div>
    </div>

    <div class="page-body">
      <div class="row g-3 mb-4">
        <div class="col-md-4"><div class="stat-card fade-up"><div class="sc-label">Available Properties</div><div class="sc-val" id="statTotal">—</div></div></div>
        <div class="col-md-4"><div class="stat-card fade-up delay-1"><div class="sc-label">Saved in Wishlist</div><div class="sc-val" id="statWish">0</div></div></div>
        <div class="col-md-4"><div class="stat-card fade-up delay-2"><div class="sc-label">Enquiries Sent</div><div class="sc-val" id="statEnq">0</div></div></div>
      </div>

      <div class="section-row mb-3">
        <h3 class="section-title">Featured Properties</h3>
        <a href="browse.html" class="btn-outline-gold btn btn-sm">Browse all →</a>
      </div>

      <div id="propsContainer">
        <div class="d-flex align-items-center gap-3 py-5 justify-content-center text-secondary">
          <div class="spinner-gold"></div> <span>Loading properties…</span>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="../js/utils.js"></script>
<script>
  const user = Auth.checkRole('buyer');
  if (user) {
    initSidebar(user, 'buyer-dashboard');
    document.getElementById('greeting').textContent =
      `Hello, ${user.name?.split(' ')[0] || 'Buyer'} 👋`;
    document.getElementById('statWish').textContent = Wishlist.count();
    document.getElementById('wishCount').textContent = Wishlist.count();

    const enquiries = parseInt(localStorage.getItem('ee_enquiry_count') || '0');
    document.getElementById('statEnq').textContent = enquiries;

    apiFetch('/properties').then(({ data }) => {
      const props = Array.isArray(data) ? data : [];
      document.getElementById('statTotal').textContent = props.length;

      const c = document.getElementById('propsContainer');
      if (props.length === 0) {
        c.innerHTML = `<div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
          <h3>No properties available</h3><p>Check back soon!</p></div>`;
      } else {
        c.innerHTML = `<div class="row g-3">
          ${props.slice(0, 3).map((p, i) => `<div class="col-md-4">${buildPropCard(p, { showWish: true, showEnquire: true, animDelay: i })}</div>`).join('')}
        </div>`;
      }
    });
  }

  // Enquiry modal (shared)
  function openEnquiry(prop) {
    window.location.href = `browse.html?enquire=${prop.property_id}`;
  }
</script>
</body>
</html>
