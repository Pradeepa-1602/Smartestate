<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — My Requests</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-shell">
  <div id="sidebarWrap"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">My Requests</h1>
        <p class="page-sub" id="reqSub">Track your property enquiries</p>
      </div>
    </div>
    <div class="page-body">
      <div id="reqContainer"></div>
    </div>
  </main>
</div>
<script src="../js/utils.js"></script>

<script>
const user = Auth.checkRole('buyer');

let reqs = [];   // ✅ FIX: define global variable

if (user) {
  initSidebar(user, 'my-requests');
  loadRequests();
}

// ✅ LOAD FROM BACKEND
async function loadRequests() {
  try {
    const res = await apiFetch('/enquiries/buyer/' + user.user_id);

    reqs = res.data || [];   // store data safely
    renderRequests();
  } catch (err) {
    document.getElementById('reqContainer').innerHTML = "Error loading requests";
  }
}

// ✅ RENDER FUNCTION
function renderRequests() {
  const c = document.getElementById('reqContainer');

  if (!reqs || reqs.length === 0) {
    c.innerHTML = "<p>No requests yet</p>";
    return;
  }

  c.innerHTML = reqs.map(r => `
    <div class="contact-card">
      <h4>${r.title}</h4>
      <p>${r.location} - ₹${Number(r.price).toLocaleString()}</p>
      <hr/>
      <p><b>Status:</b> ${r.status || "Pending"}</p>
      <p><b>Message:</b> ${r.message}</p>
    </div>
  `).join('');
}
</script>

</body>
</html>
