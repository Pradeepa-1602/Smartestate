<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Wishlist</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="../css/style.css"/>
</head>
<body>
<div class="app-shell">
  <div id="sidebarWrap"></div>
  <main class="main-content">
    <div class="page-header">
      <div>
        <h1 class="page-title">Wishlist</h1>
        <p class="page-sub" id="wishSub">Loading…</p>
      </div>
      <a href="browse.html" class="btn-gold" style="width:auto;padding:.7rem 1.2rem;text-decoration:none;">Browse More</a>
    </div>
    <div class="page-body">
      <div id="wishContainer"></div>
    </div>
  </main>
</div>
<script src="../js/utils.js"></script>
<script>
  const user = Auth.checkRole('buyer');
  if (user) {
    initSidebar(user, 'wishlist');
    renderWishlist();
  }

  function renderWishlist() {
    const list = Wishlist.get();
    document.getElementById('wishSub').textContent =
      `${list.length} saved propert${list.length !== 1 ? 'ies' : 'y'}`;

    const c = document.getElementById('wishContainer');
    if (list.length === 0) {
      c.innerHTML = `<div class="empty-state">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.84 4.61a5.5 5.5 0 00-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 00-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 000-7.78z"/></svg>
        <h3>Nothing saved yet</h3>
        <p>Tap the heart on any property to save it here.</p>
        <a href="browse.html" class="btn-gold mt-3" style="width:auto;padding:.7rem 1.3rem;text-decoration:none;display:inline-flex;">Browse Properties</a>
      </div>`;
      return;
    }

    c.innerHTML = list.map((p, i) => `
      <div class="wish-item" style="animation-delay:${i*60}ms">
        <div class="wish-thumb">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.5"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M10 6h4M10 10h4M10 14h4M10 18h4"/></svg>
        </div>
        <div class="flex-grow-1">
          <div class="wish-title">${p.title}</div>
          <div class="wish-loc">${p.location}</div>
          <span class="tag tag-gold mt-1">${p.property_type}</span>
        </div>
        <div class="text-end">
          <div class="wish-price">₹${Number(p.price).toLocaleString('en-IN')}</div>
        </div>
        <button class="btn-sm-danger" onclick="removeWish(${p.property_id})" title="Remove">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>`).join('');
  }

  function removeWish(id) {
    Wishlist.remove(id);
    renderWishlist();
    showToast('Removed from wishlist');
  }
</script>
</body>
</html>
