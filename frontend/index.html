<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EstateElite — Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

<div class="auth-wrapper">
  <!-- Left panel -->
  <div class="auth-left">
    <div class="auth-brand">EstateElite</div>
    <div class="auth-left-content fade-up">
      <h1>Find Your Next<br><em>Dream Property</em></h1>
      <p>Premium real estate platform connecting discerning buyers with exceptional properties across India.</p>
      <div class="auth-stats">
        <div><div class="stat-val">1,000+ </div><div class="stat-lbl">Properties</div></div>
        <div><div class="stat-val">560+    </div><div class="stat-lbl">Verified Owners</div></div>
        <div><div class="stat-val">97%     </div><div class="stat-lbl">Satisfaction</div></div>
      </div>
    </div>
  </div>

  <!-- Right panel -->
  <div class="auth-right">
    <div class="auth-form-wrap">
      <h2>Welcome back</h2>
      <p class="auth-sub">Sign in to your EstateElite account</p>

      <div id="errMsg" class="alert-soft mb-3 d-none"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required/>
        </div>
        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required/>
        </div>
        <button type="submit" class="btn-gold" id="submitBtn">
          <span id="btnText">Sign In</span>
          <span id="btnSpinner" class="spinner-gold d-none"></span>
        </button>
      </form>

      <div class="auth-switch mt-4">
        Don't have an account? <a href="register.html">Create one</a>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script>
  // If already logged in, redirect
  const existing = Auth.get();
  if (existing) {
    window.location.href = existing.role === 'owner'
      ? 'pages/owner-dashboard.html'
      : 'pages/buyer-dashboard.html';
  }

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('errMsg');
    errEl.classList.add('d-none');

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn      = document.getElementById('submitBtn');
    const txtEl    = document.getElementById('btnText');
    const spin     = document.getElementById('btnSpinner');

    btn.disabled = true;
    txtEl.classList.add('d-none');
    spin.classList.remove('d-none');

    const { ok, data } = await apiFetch('/users/login', {
      method: 'POST',
      body: JSON.stringify({ email, password })
    });

    btn.disabled = false;
    txtEl.classList.remove('d-none');
    spin.classList.add('d-none');

    if (!ok) {
      errEl.textContent = data?.message || 'Login failed. Check your credentials.';
      errEl.classList.remove('d-none');
      return;
    }

    Auth.save(data);
    showToast('Login successful! Redirecting…');

    setTimeout(() => {
      window.location.href = data.role === 'owner'
        ? 'pages/owner-dashboard.html'
        : 'pages/buyer-dashboard.html';
    }, 600);
  });
</script>
</body>
</html>
