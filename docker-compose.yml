services:

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
  build: ./backend
  container_name: smartestate-backend
  restart: always
  ports:
    - "5000:5000"
  env_file:
    - ./backend/.env
  environment:
    DB_HOST: mysql
  depends_on:
    mysql:
      condition: service_healthy

  mysql:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Pradeepa@2006
      MYSQL_DATABASE: estate_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: