version: '3.9'

services:

  frontend:
    build: ./frontend
    container_name: smartestate-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    container_name: smartestate-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - mysql

  mysql:
    image: mysql:8
    container_name: smartestate-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Pradeepa@2006
      MYSQL_DATABASE: estate_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
